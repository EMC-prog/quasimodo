<!DOCTYPE html>
<html>
    <head>
        <script>
            const d = new Date();
            let day = d.getDate();
            let month = d.getMonth() + 1;
            let year = d.getFullYear();
            window.location.replace("./" + year + "/" + month + "/" + day + ".html");
        </script>
    </head>
    <body>
        <p>redirecting...</p>
    </body>
</html>
